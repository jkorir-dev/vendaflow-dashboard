name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ vars.VENDAFLOW_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VENDAFLOW_SUPABASE_ANON_KEY }}
        run: |
          mkdir _site
          cp index.html app.js api.js styles.css supabase-config.js _site/
          printf 'window.VENDAFLOW_SUPABASE_URL = %s;\nwindow.VENDAFLOW_SUPABASE_ANON_KEY = %s;\n' \
            "$(jq -Rn --arg value "$SUPABASE_URL" '$value')" \
            "$(jq -Rn --arg value "$SUPABASE_ANON_KEY" '$value')" \
            > _site/supabase-config.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
